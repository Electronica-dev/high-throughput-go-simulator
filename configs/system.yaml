# Real-mode system configuration (consuma serve).
models:
  - name: model-a
    rpm: 30000
    tpm: 3000000
    estimate_tokens: 100
    actual_token_mean: 100
    latency:
      kind: lognormal
      mean_ms: 50
      sigma: 0.3
    outcome:
      success_pct: 93
      transient_pct: 5
      permanent_pct: 2
  - name: model-b
    rpm: 30000
    tpm: 3000000
    estimate_tokens: 100
    actual_token_mean: 100
    latency:
      kind: lognormal
      mean_ms: 50
      sigma: 0.3
    outcome:
      success_pct: 93
      transient_pct: 5
      permanent_pct: 2
max_wait_ms: 5000
queue_depth: 64000
wheel_shards: 2
wheel_buckets: 1024
wheel_tick_ms: 1
max_retries: 3
workers: 64
# Callback delivery schedule (owner-set knobs).
callbacks:
  initial_backoffs: [500ms, 1s, 2s]
  periodic_interval: 5s
  delivery_ttl: 5m
  http_timeout: 5s
