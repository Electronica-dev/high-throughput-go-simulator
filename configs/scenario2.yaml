# Simulator config for scenario 2: two models, limits = system limits x
# headroom (10x). Scenario 2 pins the SYSTEM's limits per the spec -
# model-a 30,000 RPM / 60M TPM, model-b 20,000 RPM / 40M TPM - then changes
# model-a LIVE (30K -> 5K -> 30K RPM); the simulator's limits stay fixed -
# that is the owner decision: the simulator is a separate fixed entity.
# estimate/actual tokens are 2000 so the TPM limit (not just RPM) is the
# binding constraint at the submitted 94% rate.
models:
  - name: model-a
    rpm: 300000
    tpm: 600000000
    estimate_tokens: 2000
    actual_token_mean: 2000
    latency:
      kind: lognormal
      mean_ms: 50
      sigma: 0.3
    outcome:
      success_pct: 93
      transient_pct: 5
      permanent_pct: 2
  - name: model-b
    rpm: 200000
    tpm: 400000000
    estimate_tokens: 2000
    actual_token_mean: 2000
    latency:
      kind: lognormal
      mean_ms: 50
      sigma: 0.3
    outcome:
      success_pct: 93
      transient_pct: 5
      permanent_pct: 2
max_wait_ms: 2000
queue_depth: 64000
wheel_shards: 2
wheel_buckets: 1024
wheel_tick_ms: 1
max_retries: 3
