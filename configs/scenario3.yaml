# Simulator config for scenario 3: two models, limits = system.yaml ×
# headroom (10×). Scenario 3 exercises the failure mix; the sink rejects
# the first two callback deliveries, then accepts.
# owner decision: the simulator is a separate fixed entity.
models:
  - name: model-a
    rpm: 300000
    tpm: 30000000
    estimate_tokens: 100
    actual_token_mean: 100
    latency:
      kind: lognormal
      mean_ms: 50
      sigma: 0.3
    outcome:
      success_pct: 93
      transient_pct: 5
      permanent_pct: 2
  - name: model-b
    rpm: 300000
    tpm: 30000000
    estimate_tokens: 100
    actual_token_mean: 100
    latency:
      kind: lognormal
      mean_ms: 50
      sigma: 0.3
    outcome:
      success_pct: 93
      transient_pct: 5
      permanent_pct: 2
max_wait_ms: 2000
queue_depth: 64000
wheel_shards: 2
wheel_buckets: 1024
wheel_tick_ms: 1
max_retries: 3
